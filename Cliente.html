<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina do Minuto - Cliente</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      font-size: 11px;
    }

    body {
      background-color: #f0f4f8;
      margin: 10px;
      color: #333;
    }

    /* Topo Loja */
    .top-bar {
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-bar select {
      padding: 3px 6px;
      border: 1px solid #7f9db9;
      background-color: #fff;
      font-weight: bold;
      color: #000080;
      border-radius: 2px;
    }

    /* Painel de Busca Responsivo */
    .search-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      align-items: end;
      background-color: #f0f4f8;
      padding: 8px;
      border: 1px solid #b4c6e7;
      margin-bottom: 10px;
      border-radius: 3px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.span-2 {
      grid-column: span 2;
    }

    .form-group label {
      font-weight: bold;
      color: #000080;
      margin-bottom: 3px;
    }

    .form-group input {
      border: 1px solid #7f9db9;
      padding: 3px 6px;
      height: 26px;
      background-color: #fff;
      border-radius: 2px;
      width: 100%;
    }

    .btn-search {
      height: 45px;
      background: linear-gradient(to bottom, #ffffff, #dce6f1);
      border: 1px solid #7f9db9;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000080;
      padding: 4px;
      width: 100%;
      min-width: 80px;
    }

    .btn-search:hover {
      background: #c6d9f1;
    }

    /* Main Grid Responsivo */
    .main-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
      align-items: start;
    }

    .section-title {
      font-weight: bold;
      color: #000080;
      margin-bottom: 4px;
    }

    /* Caixa Lista */
    .list-box {
      border: 1px solid #7f9db9;
      background-color: #fff;
      height: 350px;
      max-height: 50vh;
      overflow-y: auto;
      border-radius: 2px;
    }

    .list-box div {
      padding: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      border-bottom: 1px dotted #e0e0e0;
    }

    .list-box div.selected {
      background-color: #000080;
      color: #fff;
    }

    /* Botões Navegação */
    .nav-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
      padding-top: 20px;
    }

    .btn-nav {
      background: linear-gradient(to bottom, #ffffff, #dce6f1);
      border: 1px solid #7f9db9;
      padding: 6px;
      text-align: center;
      font-size: 10px;
      color: #000080;
      cursor: pointer;
      border-radius: 3px;
      font-weight: bold;
    }

    /* Tabelas */
    .table-container {
      border: 1px solid #7f9db9;
      background-color: #fff;
      height: 350px;
      max-height: 50vh;
      overflow: auto;
      border-radius: 2px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background-color: #c6d9f1;
      border: 1px solid #7f9db9;
      padding: 5px;
      text-align: center;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      border: 1px solid #e0e0e0;
      padding: 4px;
      text-align: center;
    }

    /* Detalhes */
    .details-box {
      border: 1px solid #7f9db9;
      background-color: #f9f9f9;
      padding: 6px;
      height: 80px;
      overflow-y: auto;
      border-radius: 2px;
    }

    /* Legendas Responsivas */
    .legend-container {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px;
      margin-top: 10px;
      background-color: #e8eef5;
      padding: 8px;
      border: 1px solid #b4c6e7;
      border-radius: 3px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-box {
      width: 14px;
      height: 14px;
      border: 1px solid #7f9db9;
      flex-shrink: 0;
    }

    .legend-footer {
      grid-column: 1 / -1;
      font-weight: bold;
      margin-top: 4px;
      color: #000080;
    }

    /* Cores Status */
    .bg-pago { background-color: #d9d9d9; }
    .bg-nao-pago { background-color: #749ab5; }
    .bg-anulado { background-color: #f4b084; }
    .bg-entregue-pago { background-color: #c6efce; }
    .bg-orcamento { background-color: #b4e6eb; }
    .bg-delivery { background-color: #f4b084; }
    .bg-entregue-nao-pago { background-color: #8ede76; }
    .bg-orc-nao-aprovado { background-color: #f8cbad; }

    tr.status-pago td { background-color: #d9d9d9 !important; color: #000 !important; }
    tr.status-nao-pago td { background-color: #749ab5 !important; color: #000 !important; }
    tr.status-anulado td { background-color: #f4b084 !important; color: #000 !important; }
    tr.status-entregue-pago td { background-color: #c6efce !important; color: #000 !important; }
    tr.status-orcamento td { background-color: #b4e6eb !important; color: #000 !important; }
    tr.status-delivery td { background-color: #f4b084 !important; color: #000 !important; }
    tr.status-entregue-nao-pago td { background-color: #8ede76 !important; color: #000 !important; }
    tr.status-orc-nao-aprovado td { background-color: #f8cbad !important; color: #000 !important; }

    /* Ajustes específicos para telas muito pequenas (Smartphones) */
    @media (max-width: 600px) {
      .form-group.span-2 {
        grid-column: span 1;
      }
      .nav-buttons {
        flex-direction: row;
        padding-top: 0;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span>LOJA:</span>
    <select id="select-loja">
      <option value="100">100 - Oficina do Minuto I</option>
      <option value="101">101 - Oficina do Minuto II</option>
      <option value="102">102 - Oficina do Minuto III</option>
      <option value="103">103 - Oficina do Minuto IV</option>
    </select>
  </div>

  <!-- Form de Busca -->
  <div class="search-panel">
    <div class="form-group">
      <label>Telefone</label>
      <input type="text" id="filtro-telefone">
    </div>
    <div class="form-group">
      <label>Nome 💡</label>
      <input type="text" id="filtro-nome">
    </div>
    <div class="form-group">
      <label>Código</label>
      <input type="text" id="filtro-codigo" readonly>
    </div>
    
    <div>
      <button class="btn-search" id="btn-pesquisar">
        🔍<br> Pesquisar
      </button>
    </div>

    <div class="form-group span-2">
      <label>Endereço</label>
      <input type="text" id="filtro-endereco" readonly>
    </div>
    <div class="form-group span-2">
      <label>CPF/CNPJ</label>
      <input type="text" id="filtro-cpf" readonly>
    </div>
  </div>

  <!-- Conteúdo Principal -->
  <div class="main-grid">
    
    <!-- Coluna Resultado -->
    <div>
      <div class="section-title">Resultado</div>
      <div class="list-box" id="lista-resultados">
        <!-- Preenchido via JS -->
      </div>
    </div>

    <!-- Tabela Tickets em Aberto -->
    <div>
      <div class="section-title">Tickets em Aberto</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Série</th>
              <th>Ticket</th>
              <th>Emissão</th>
              <th>Pos.</th>
              <th>*</th>
            </tr>
          </thead>
          <tbody id="tabela-abertos-body">
            <!-- Preenchido via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Tabela Tickets Entregues/Anulados -->
    <div>
      <div class="section-title">Tickets Entregues/Anulados</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Série</th>
              <th>Ticket</th>
              <th>Emissão</th>
              <th>*</th>
            </tr>
          </thead>
          <tbody id="tabela-entregues-body">
            <!-- Preenchido via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Painel Lateral / Ações -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div>
        <div class="section-title">&nbsp;</div>
        <button class="btn-search">
          🔍<br> Ticket
        </button>
      </div>

      <div>
        <div class="section-title">Detalhes Endereço</div>
        <div class="details-box" id="detalhes-endereco-box">
          <!-- Preenchido via JS -->
        </div>
      </div>
    </div>

    <!-- Legenda de Status -->
    <div class="legend-container">
      <div class="legend-item"><div class="legend-box bg-pago"></div> Pago</div>
      <div class="legend-item"><div class="legend-box bg-nao-pago"></div> Não Pago</div>
      <div class="legend-item"><div class="legend-box bg-anulado"></div> Anulado</div>
      <div class="legend-item"><div class="legend-box bg-entregue-pago"></div> Entregue Pago</div>
      
      <div class="legend-item"><div class="legend-box bg-orcamento"></div> Orçamento</div>
      <div class="legend-item"><div class="legend-box bg-delivery"></div> Delivery</div>
      <div class="legend-item"><div class="legend-box bg-entregue-nao-pago"></div> Entregue Não Pago</div>
      <div class="legend-item"><div class="legend-box bg-orc-nao-aprovado"></div> Orç. Não Aprovado</div>

      <div class="legend-footer">
        (*)Tck c/ Observação, (D)Disp.
      </div>
    </div>

  </div>

  <!-- Script de Conexão com o Back-end -->
  <script type="module" src="./js/Cliente.js"></script>
</body>
</html>
