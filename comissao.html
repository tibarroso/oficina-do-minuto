<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Premiação / Comissão</title>
    <!-- Bootstrap 5 CDN para um layout limpo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
        .relatorio-container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .report-header { border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .operador-section { margin-bottom: 30px; border: 1px solid #dee2e6; border-radius: 6px; padding: 15px; background: #fff; }
        .table-sm td, .table-sm th { font-size: 0.9rem; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff; }
            .relatorio-container { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- Filtros de Pesquisa (Não saem na impressão) -->
    <div class="card mb-4 no-print shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Filtros do Relatório</h5>
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="codigoLoja" class="form-label">Código da Loja</label>
                    <input type="number" id="codigoLoja" class="form-control" value="100">
                </div>
                <div class="col-md-3">
                    <label for="dataInicio" class="form-label">Data Início</label>
                    <input type="date" id="dataInicio" class="form-control" value="2026-10-01">
                </div>
                <div class="col-md-3">
                    <label for="dataFim" class="form-label">Data Fim</label>
                    <input type="date" id="dataFim" class="form-control" value="2026-10-31">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-primary w-100" onclick="carregarRelatorio()">Gerar Relatório</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Área Impressível do Relatório -->
    <div class="relatorio-container" id="relatorioArea">
        <div class="report-header d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-1 text-uppercase">Premiação Geral Resumido</h4>
                <p class="mb-0 text-muted" id="lblPeriodo">Período de --/--/---- até --/--/----</p>
            </div>
            <div class="text-end">
                <p class="mb-1"><strong>Geração:</strong> <span id="lblGeracao">--/--/---- --:--</span></p>
                <button class="btn btn-secondary btn-sm no-print" onclick="window.print()">Imprimir / PDF</button>
            </div>
        </div>

        <div class="mb-4">
            <h5 id="lblLoja" class="fw-bold">Loja: --</h5>
            <p class="text-secondary small">Premiações Fechadas no período selecionado</p>
        </div>

        <!-- Conteúdo Dinâmico dos Operadores -->
        <div id="conteudoOperadores">
            <div class="text-center text-muted py-5">Clique em "Gerar Relatório" para exibir os dados.</div>
        </div>

        <!-- Rodapé Geral -->
        <div class="mt-4 pt-3 border-top text-end" id="divValorGeral" style="display: none;">
            <h4 class="fw-bold text-success">Valor Geral da Premiação: R$ <span id="lblValorGeralTotal">0,00</span></h4>
        </div>
    </div>
</div>

<script>
    function formatarMoeda(valor) {
        return Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatarDataHora(dataStr) {
        if (!dataStr) return '';
        const data = new Date(dataStr);
        return data.toLocaleDateString('pt-BR') + ' ' + data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function formatarApenasData(dataStr) {
        if (!dataStr) return '';
        const data = new Date(dataStr);
        return data.toLocaleDateString('pt-BR');
    }

    async function carregarRelatorio() {
        const codigoLoja = document.getElementById('codigoLoja').value;
        const dataInicio = document.getElementById('dataInicio').value;
        const dataFim = document.getElementById('dataFim').value;

        if (!codigoLoja || !dataInicio || !dataFim) {
            alert('Preencha todos os campos do filtro.');
            return;
        }

        // Atualizar cabeçalhos visuais
        document.getElementById('lblPeriodo').innerText = `Período de ${formatarApenasData(dataInicio)} até ${formatarApenasData(dataFim)}`;
        document.getElementById('lblGeracao').innerText = formatarDataHora(new Date());

        try {
            const response = await fetch(`/api/relatorio-comissao?codigoLoja=${codigoLoja}&dataInicio=${dataInicio}&dataFim=${dataFim}`);
            const dados = await response.json();

            if (dados.error) {
                alert(dados.error);
                return;
            }

            if (dados.length === 0) {
                document.getElementById('conteudoOperadores').innerHTML = '<div class="alert alert-warning text-center">Nenhum registro encontrado para o período.</div>';
                document.getElementById('divValorGeral').style.display = 'none';
                return;
            }

            // Atribuir nome da loja (se vier nos dados)
            document.getElementById('lblLoja').innerText = `Loja: ${dados[0].com_CodigoLoja} - ${dados[0].OperadorComissionado ? 'OFICINA DO MINUTO' : ''}`;

            // Agrupar dados por Operador
            const agrupadoPorOperador = {};
            dados.forEach(item => {
                const op = item.OperadorComissionado || 'NÃO INFORMADO';
                if (!agrupadoPorOperador[op]) {
                    agrupadoPorOperador[op] = [];
                }
                agrupadoPorOperador[op].push(item);
            });

            let htmlGeral = '';
            let valorGeralTotal = 0;

            for (const [operador, itens] of Object.entries(agrupadoPorOperador)) {
                let baseCalcTotal = 0;
                let premiaTotalOperador = 0;

                let linhasTabela = '';
                itens.forEach(item => {
                    const vlTotal = Number(item.PrecoTotal || 0);
                    const desc = Number(item.DescontoTotal || 0);
                    const txAd = Number(item.ValorTaxaAdicionalComissao || 0);
                    const baseCalc = vlTotal - desc + txAd; // Ou PrecoTotalComDesconto + Tx
                    const perc = Number(item.com_PorcentagemComissao || 0);
                    const vlPrem = Number(item.ValorComissao || 0);

                    baseCalcTotal += baseCalc;
                    premiaTotalOperador += vlPrem;

                    linhasTabela += `
                        <tr>
                            <td>${formatarApenasData(item.Data)}</td>
                            <td class="text-end">${formatarMoeda(vlTotal)}</td>
                            <td class="text-end">${formatarMoeda(desc)}</td>
                            <td class="text-end">${formatarMoeda(txAd)}</td>
                            <td class="text-end">${formatarMoeda(baseCalc)}</td>
                            <td class="text-center">${formatarMoeda(perc)}%</td>
                            <td class="text-end fw-bold">${formatarMoeda(vlPrem)}</td>
                        </tr>
                    `;
                });

                valorGeralTotal += premiaTotalOperador;

                htmlGeral += `
                    <div class="operador-section">
                        <h6 class="fw-bold text-primary mb-2">Operador: ${operador}</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-bordered align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Execução</th>
                                        <th class="text-end">Vl. Total</th>
                                        <th class="text-end">Desc</th>
                                        <th class="text-end">Tx. Ad.</th>
                                        <th class="text-end">Base Calc.</th>
                                        <th class="text-center">% P.</th>
                                        <th class="text-end">Vl. Prem.</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${linhasTabela}
                                </tbody>
                            </table>
                        </div>
                        <div class="text-end mt-2">
                            <span class="me-4 text-muted">Valor Base de Cálculo: <strong>R$ ${formatarMoeda(baseCalcTotal)}</strong></span>
                            <span class="me-4 text-muted">Total Premiação por Execução: <strong>R$ ${formatarMoeda(premiaTotalOperador)}</strong></span>
                            <span class="text-dark">Total Geral da Premiação por Operador: <strong>R$ ${formatarMoeda(premiaTotalOperador)}</strong></span>
                        </div>
                    </div>
                `;
            }

            document.getElementById('conteudoOperadores').innerHTML = htmlGeral;
            document.getElementById('lblValorGeralTotal').innerText = formatarMoeda(valorGeralTotal);
            document.getElementById('divValorGeral').style.display = 'block';

        } catch (error) {
            console.error('Erro ao carregar relatório:', error);
            alert('Erro ao carregar os dados da comissão.');
        }
    }
</script>

</body>
</html>
