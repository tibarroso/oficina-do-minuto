<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Oficina do Minuto</title>
  
  <!-- Link para o estilo -->
  <link rel="stylesheet" href="./css/style.css">
  
  <!-- Biblioteca Chart.js (corrigido para CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Estilos básicos */
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9f9f9;
    }

    h1, h2 {
      color: #333;
    }

    /* Filtros */
    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .filtros label {
      font-size: 14px;
      color: #333;
    }

    .filtros select, .filtros input {
      padding: 8px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .filtros button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .filtros button:hover {
      background-color: #45a049;
    }

    /* Container de gráficos */
    .charts-container {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 40px;
    }

    canvas {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* Lista de pedidos */
    #containerPedidos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .loading {
      text-align: center;
      font-size: 18px;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>Dashboard - Oficina do Minuto</h1>

  <!-- Filtros -->
  <div class="filtros">
    <label for="filtroStatus">Status:</label>
    <select id="filtroStatus">
      <option value="">Todos</option>
      <option value="Aguardando coleta">Aguardando coleta</option>
      <option value="Entregue na Loja 5">Entregue na Loja 5</option>
      <option value="Finalizado">Finalizado</option>
      <option value="Em serviço">Em serviço</option>
      <option value="Retrabalho">Retrabalho</option>
    </select>

    <label for="pesquisaOS">Pesquisar OS/Loja:</label>
    <input type="text" id="pesquisaOS" placeholder="Digite OS ou Loja">
    <button id="btnFiltrar">Filtrar</button>
  </div>

  <!-- Gráficos -->
  <h2>Gráficos de Pedidos</h2>
  <div class="charts-container">
    <canvas id="graficoStatus" width="400" height="150"></canvas>
    <canvas id="graficoServico" width="400" height="150"></canvas>
  </div>

  <!-- Lista de Pedidos -->
  <h2>Lista de Pedidos</h2>
  <div id="containerPedidos" class="cards-container">
    <p class="loading">Carregando pedidos...</p>
  </div>

  <!-- Script -->
  <script type="module" src="./js/dashboard.js"></script>

</body>
</html>
