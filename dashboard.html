<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Oficina do Minuto</title>
  
  <!-- Link para o estilo -->
  <link rel="stylesheet" href="./css/style.css">
  
<!-- Carregar a versão específica do Chart.js (versão estável) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>


  <!-- CDN do Supabase (Aqui é onde você carrega o Supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

</head>
<body>

  <h1>Dashboard - Oficina do Minuto</h1>

  <!-- Filtros -->
  <div class="filtros">
    <label for="filtroStatus">Status:</label>
    <select id="filtroStatus">
      <option value="">Todos</option>
      <option value="Aguardando coleta">Aguardando coleta</option>
      <option value="Entregue na Loja 5">Entregue na Loja 5</option>
      <option value="Finalizado">Finalizado</option>
    </select>

    <label for="pesquisaOS">Pesquisar OS/Loja:</label>
    <input type="text" id="pesquisaOS" placeholder="Digite OS ou Loja">
    <button id="btnFiltrar">Filtrar</button>
  </div>

  <!-- Gráficos -->
  <h2>Gráficos de Pedidos</h2>
  <div class="charts-container">
    <canvas id="graficoStatus" width="400" height="150"></canvas>
    <canvas id="graficoServico" width="400" height="150"></canvas>
  </div>

  <!-- Lista de Pedidos -->
  <h2>Lista de Pedidos</h2>
  <div id="containerPedidos" class="cards-container">
    <p class="loading">Carregando pedidos...</p>
  </div>

  <!-- Script -->
  <script type="module" src="./js/dashboard.js"></script> <!-- O seu JS deve ser carregado aqui depois do Supabase -->

</body>
</html>
