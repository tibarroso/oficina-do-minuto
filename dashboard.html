<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard - Oficina do Minuto</title>
<link rel="stylesheet" href="./css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .cards-container { display: flex; flex-wrap: wrap; gap: 20px; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; width: 300px; background: #f9f9f9; }
  .preview img { width: 80px; height: 80px; object-fit: cover; margin: 5px; border-radius: 5px; border: 1px solid #ddd; }
  .btn-primary { background-color: #337ab7; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; }
  .btn-primary:hover { background-color: #286090; }
</style>
</head>
<body>

<h1>Dashboard - Oficina do Minuto</h1>

<!-- Botão Criar Pedido para lojas -->
<div id="btnCriarPedidoContainer"></div>

<!-- Filtros -->
<div class="filtros">
  <label>Status:</label>
  <select id="filtroStatus">
    <option value="">Todos</option>
    <option value="Aguardando coleta">Aguardando coleta</option>
    <option value="Entregue na Loja 5">Entregue na Loja 5</option>
    <option value="Finalizado">Finalizado</option>
  </select>

  <label>Pesquisar OS/Loja:</label>
  <input type="text" id="pesquisaOS" placeholder="Digite OS ou Loja">

  <button id="btnFiltrar">Filtrar</button>
</div>

<!-- Gráficos -->
<h2>Gráficos de Pedidos</h2>
<canvas id="graficoStatus" width="400" height="150"></canvas>
<canvas id="graficoServico" width="400" height="150"></canvas>

<!-- Lista de pedidos -->
<h2>Lista de Pedidos</h2>
<div id="containerPedidos" class="cards-container"></div>

<script type="module" src="./js/dashboard.js"></script>
</body>
</html>
