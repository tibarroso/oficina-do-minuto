<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina do Minuto - Login</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    /* Força o HTML e BODY a tomarem 100% da tela */
    html, body {
      height: 100%;
      width: 100%;
    }

    body { 
      font-family: 'Roboto', sans-serif; 
      background-color: #f0f2f5; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      color: #333; 
      position: relative;
    }

    .container { 
      background-color: #fff; 
      border-radius: 20px; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); 
      padding: 40px 30px; 
      width: 90%; 
      max-width: 400px; 
      text-align: center; 
      position: relative; 
      transition: transform 0.3s ease-in-out; 
    }

    .container:hover { 
      transform: translateY(-5px); 
    }

    .container::before { 
      content: ""; 
      position: absolute; 
      top: -20px; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 60px; 
      height: 5px; 
      background-color: #007BFF; 
      border-radius: 10px; 
    }

    h2 { 
      font-size: 30px; 
      color: #007BFF; 
      margin-bottom: 30px; 
      font-weight: 700; 
    }

    input { 
      width: 100%; 
      padding: 18px; 
      margin: 12px 0; 
      border: 2px solid #ddd; 
      border-radius: 12px; 
      font-size: 16px; 
      color: #333; 
      background-color: #f7f7f7; 
      transition: border 0.3s ease, background-color 0.3s ease; 
    }

    input:focus { 
      border-color: #007BFF; 
      background-color: #fff; 
      outline: none; 
    }

    button { 
      width: 100%; 
      padding: 18px; 
      background-color: #007BFF; 
      color: white; 
      border: none; 
      border-radius: 12px; 
      font-size: 18px; 
      cursor: pointer; 
      transition: background-color 0.3s ease, transform 0.2s ease; 
    }

    button:hover { 
      background-color: #0056b3; 
      transform: translateY(-3px); 
    }

    #loader { 
      display: none; 
      width: 30px; 
      height: 30px; 
      border: 4px solid #f3f3f3; 
      border-top: 4px solid #007BFF; 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
      margin: 20px auto; 
    }

    .forgot-password { 
      display: inline-block; 
      margin-top: 15px; 
      color: #007BFF; 
      text-decoration: none; 
      font-size: 14px; 
    }

    .forgot-password:hover { 
      text-decoration: underline; 
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 13px;
      color: #777;
      text-align: center;
    }

    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Oficina do Minuto</h2>
    <input id="email" type="email" placeholder="Email" required>
    <input id="senha" type="password" placeholder="Senha" required>
    <button id="loginButton">Entrar</button> 
    <div id="loader"></div>
    <a href="#" class="forgot-password">Esqueci minha senha</a>
  </div>

  <footer>
    &copy; 2026 Oficina do Minuto. Todos os direitos reservados.
  </footer>

  <script type="module">
    // Ajustado de '/js/supabase.js' para './supabase.js' (carrega da raiz)
    import { supabase } from './supabase.js'; 

    document.getElementById("loginButton").addEventListener("click", login);

    async function login() {
      const email = document.getElementById("email").value.trim().toLowerCase();
      const senha = document.getElementById("senha").value;

      if (!email || !senha) {
        alert("Preencha email e senha!");
        return;
      }

      const loader = document.getElementById("loader");
      const loginButton = document.getElementById("loginButton");

      loader.style.display = "block";
      loginButton.disabled = true;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: senha
        });

        if (error) throw error;

        if (data?.user) {
          const usuarioEmail = data.user.email.toLowerCase();

          if (usuarioEmail === "ti@ebarroso.com.br") {
            window.location.href = "admin.html";
          } else if (usuarioEmail.includes("transporte")) {
            window.location.href = "transporte.html";
          } else if (usuarioEmail.includes("loja5")) {
            window.location.href = "loja5.html";
          } else {
            window.location.href = "pedidos.html";
          }
        }

      } catch (err) {
        alert("Erro no login: " + err.message);
      } finally {
        loader.style.display = "none";
        loginButton.disabled = false;
      }
    }
  </script>
   
</body>
</html>
