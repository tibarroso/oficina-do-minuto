<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina do Minuto - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/auth.js"></script>
  <style>
    /* Resetando margens e paddings */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Corpo da página */
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #e7e9f1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }

    /* Container do login */
    .container {
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      padding: 40px 30px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      transition: transform 0.3s ease-in-out;
      position: relative;
    }

    /* Efeito de hover no container */
    .container:hover {
      transform: scale(1.03);
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(0, 123, 255, 0.1), rgba(0, 123, 255, 0.2));
      border-radius: 16px;
      z-index: -1;
      transition: background 0.3s ease;
    }

    .container:hover::before {
      background: linear-gradient(135deg, rgba(0, 123, 255, 0.3), rgba(0, 123, 255, 0.4));
    }

    h2 {
      font-size: 32px;
      color: #2d2f3b;
      margin-bottom: 30px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Estilo dos campos de entrada */
    input {
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      color: #333;
      background-color: #f9f9f9;
      transition: border 0.3s ease, background-color 0.3s ease;
    }

    /* Estilo ao focar nos campos */
    input:focus {
      border-color: #007BFF;
      background-color: #fff;
      outline: none;
    }

    /* Botão de login */
    button {
      width: 100%;
      padding: 16px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    /* Efeito hover no botão */
    button:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
    }

    /* Estilo para o link de 'Esqueci minha senha' */
    .forgot-password {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      color: #007BFF;
      text-decoration: none;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    /* Efeito hover no link */
    .forgot-password:hover {
      color: #0056b3;
      text-shadow: 0 1px 5px rgba(0, 123, 255, 0.5);
    }

    /* Responsividade para telas menores */
    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
        max-width: 100%;
      }

      h2 {
        font-size: 28px;
      }

      input {
        padding: 12px;
        font-size: 15px;
      }

      button {
        font-size: 16px;
        padding: 14px;
      }

      .forgot-password {
        font-size: 13px;
      }
    }

    @media (max-width: 400px) {
      h2 {
        font-size: 24px;
      }

      input {
        padding: 10px;
        font-size: 14px;
      }

      button {
        font-size: 14px;
        padding: 12px;
      }

      .forgot-password {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Oficina do Minuto</h2>
    <input id="email" type="email" placeholder="Email" required>
    <input id="senha" type="password" placeholder="Senha" required>
    <button onclick="login()">Entrar</button>
    <a href="#" class="forgot-password">Esqueci minha senha</a>
  </div>
</body>
</html>
