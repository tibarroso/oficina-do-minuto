<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina do Minuto - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/auth.js"></script>
  <style>
    /* Resetando margens e paddings */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Corpo da página */
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }

    /* Container com visual de app */
    .container {
      background-color: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
      transition: transform 0.3s ease-in-out;
    }

    /* Efeito de hover para o container */
    .container:hover {
      transform: translateY(-5px);
    }

    .container::before {
      content: "";
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 5px;
      background-color: #007BFF;
      border-radius: 10px;
    }

    h2 {
      font-size: 30px;
      color: #007BFF;
      margin-bottom: 30px;
      font-weight: 700;
    }

    /* Estilo dos campos de entrada */
    input {
      width: 100%;
      padding: 18px;
      margin: 12px 0;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      color: #333;
      background-color: #f7f7f7;
      transition: border 0.3s ease, background-color 0.3s ease;
    }

    /* Estilo ao focar nos campos */
    input:focus {
      border-color: #007BFF;
      background-color: #fff;
      outline: none;
    }

    /* Botão de login */
    button {
      width: 100%;
      padding: 18px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    /* Efeito de hover no botão */
    button:hover {
      background-color: #0056b3;
      transform: translateY(-3px);
    }

    /* Estilo para o link de 'Esqueci minha senha' */
    .forgot-password {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      color: #007BFF;
      text-decoration: none;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    /* Efeito hover no link */
    .forgot-password:hover {
      color: #0056b3;
      text-shadow: 0 1px 5px rgba(0, 123, 255, 0.5);
    }

    /* Loader de carregamento */
    #loader {
      display: none;
      width: 30px;
      height: 30px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007BFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    /* Animação do loader */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsividade para telas menores */
    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
        max-width: 100%;
      }

      h2 {
        font-size: 28px;
      }

      input {
        padding: 14px;
        font-size: 15px;
      }

      button {
        font-size: 16px;
        padding: 15px;
      }

      .forgot-password {
        font-size: 13px;
      }
    }

    @media (max-width: 400px) {
      h2 {
        font-size: 24px;
      }

      input {
        padding: 12px;
        font-size: 14px;
      }

      button {
        font-size: 14px;
        padding: 12px;
      }

      .forgot-password {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Oficina do Minuto</h2>
    <input id="email" type="email" placeholder="Email" required>
    <input id="senha" type="password" placeholder="Senha" required>
    <button id="loginButton" onclick="login()">Entrar</button>
    <div id="loader"></div>
    <a href="#" class="forgot-password">Esqueci minha senha</a>
  </div>

  <script>
    // Função de login
    async function login() {
      const email = document.getElementById("email").value.trim().toLowerCase();
      const senha = document.getElementById("senha").value.trim();

      if (!email || !senha) {
        alert("Preencha email e senha!");
        return;
      }

      const loader = document.getElementById("loader");
      const loginButton = document.getElementById("loginButton");

      // Exibe o loader e desabilita o botão durante o processo de login
      loader.style.display = "block";
      loginButton.disabled = true;

      try {
        // Simulação de processo de login (Exemplo com supabase)
        // Aqui você pode integrar com o seu serviço de login real (supabase, firebase, etc.)
        setTimeout(() => {
          alert("Login bem-sucedido!");
          window.location.href = "/dashboard.html"; // Redireciona para o dashboard (ou outra página)
        }, 2000); // Simula o tempo de resposta do login

      } catch (err) {
        alert("Erro no login: " + err.message);
      } finally {
        // Esconde o loader e habilita o botão novamente
        loader.style.display = "none";
        loginButton.disabled = false;
      }
    }
  </script>
</body>
</html>
