<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina do Minuto - Login</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #18bc9c;
      --danger: #e74c3c;
      --light: #ecf0f1;
      --dark: #2c3e50;
      --bg-body: #f4f6f7;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body { 
      background-color: var(--bg-body); 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      color: var(--dark); 
      position: relative;
    }

    .container { 
      background-color: #fff; 
      border-radius: 6px; 
      border: 1px solid #ddd;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); 
      padding: 30px; 
      width: 90%; 
      max-width: 380px; 
      text-align: center; 
      position: relative; 
    }

    h2 { 
      font-size: 22px; 
      color: var(--primary); 
      margin-bottom: 20px; 
      font-weight: bold;
    }

    input { 
      width: 100%; 
      padding: 12px; 
      margin: 10px 0; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      font-size: 14px; 
      color: #333; 
      background-color: #fff; 
      transition: border-color 0.2s; 
    }

    input:focus { 
      border-color: var(--primary); 
      outline: none; 
    }

    button { 
      width: 100%; 
      padding: 12px; 
      background-color: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-size: 14px; 
      font-weight: bold;
      cursor: pointer; 
      transition: background-color 0.2s; 
      margin-top: 5px;
    }

    button:hover { 
      background-color: #1a252f; 
    }

    #loader { 
      display: none; 
      width: 24px; 
      height: 24px; 
      border: 3px solid #f3f3f3; 
      border-top: 3px solid var(--primary); 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
      margin: 15px auto; 
    }

    .forgot-password { 
      display: inline-block; 
      margin-top: 15px; 
      color: #2980b9; 
      text-decoration: none; 
      font-size: 13px; 
    }

    .forgot-password:hover { 
      text-decoration: underline; 
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 12px;
      color: #7f8c8d;
      text-align: center;
    }

    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Oficina do Minuto</h2>
    <input id="email" type="email" placeholder="Email" required>
    <input id="senha" type="password" placeholder="Senha" required>
    <button id="loginButton">Entrar</button> 
    <div id="loader"></div>
    <a href="#" class="forgot-password">Esqueci minha senha</a>
  </div>

  <footer>
    &copy; 2026 Oficina do Minuto. Todos os direitos reservados.
  </footer>

  <script type="module">
    import { supabase } from './supabase.js'; 

    document.getElementById("loginButton").addEventListener("click", login);

    async function login() {
      const email = document.getElementById("email").value.trim().toLowerCase();
      const senha = document.getElementById("senha").value;

      if (!email || !senha) {
        alert("Preencha email e senha!");
        return;
      }

      const loader = document.getElementById("loader");
      const loginButton = document.getElementById("loginButton");

      loader.style.display = "block";
      loginButton.disabled = true;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: senha
        });

        if (error) throw error;

        if (data?.user) {
          const usuarioEmail = data.user.email.toLowerCase();

          if (usuarioEmail === "ti@ebarroso.com.br") {
            window.location.href = "admin.html";
          } else if (usuarioEmail.includes("transporte")) {
            window.location.href = "transporte.html";
          } else if (usuarioEmail.includes("loja5")) {
            window.location.href = "loja5.html";
          } else {
            window.location.href = "pedidos.html";
          }
        }

      } catch (err) {
        alert("Erro no login: " + err.message);
      } finally {
        loader.style.display = "none";
        loginButton.disabled = false;
      }
    }
  </script>
    
</body>
</html>
