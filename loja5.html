<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja 5 – Central | Oficina do Minuto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-blue: #0f172a;
      --accent-yellow: #f59e0b;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-soft: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.02);
      --shadow-hover: 0 20px 30px -10px rgba(15, 23, 42, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER MODERNO COM GLASSMORPHISM */
    header {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      color: white;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 72px;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icone-relogio {
      font-size: 22px;
      background: rgba(255, 255, 255, 0.1);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
    }

    .marca-texto {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .tag-loja5 {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    header nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
    }

    header nav a:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.08);
    }

    header nav a.active {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.15);
    }

    header nav a.btn-sair {
      color: #f87171;
    }

    header nav a.btn-sair:hover {
      background-color: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    /* CONTAINER PRINCIPAL */
    main {
      max-width: 1400px;
      margin: 110px auto 50px auto;
      padding: 0 40px;
    }

    .section-intro {
      margin-bottom: 32px;
    }

    .section-intro h2 {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary-blue);
      letter-spacing: -0.5px;
    }

    .section-intro p {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* TOAST DE SUCESSO ELEGANTE */
    .success-toast {
      display: none;
      position: fixed;
      top: 90px;
      right: 40px;
      background-color: var(--accent-green);
      color: white;
      padding: 14px 24px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
      font-weight: 600;
      font-size: 14px;
      z-index: 1001;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* GRID DE CARDS */
    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }

    /* CARD ESTILIZADO */
    .card {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      transition: all 0.25s ease;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: #3b82f6;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: #cbd5e1;
    }

    .card strong {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .card em, .card .obs-italic, .card p i {
      font-style: normal;
      color: #334155;
      font-size: 13.5px;
      display: block;
      margin-top: 6px;
      background: #f1f5f9;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border-left: 3px solid #94a3b8;
    }

    .card textarea {
      width: 100%;
      min-height: 85px;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      font-family: inherit;
      font-size: 13px;
      color: var(--text-main);
      background-color: #f8fafc;
      resize: vertical;
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .card textarea:focus {
      outline: none;
      border-color: #3b82f6;
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    /* BADGES DE STATUS MODERNOS */
    .status-tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: fit-content;
      color: white !important;
    }

    .status-Aguardando { background-color: #f59e0b; }
    .status-Transporte { background-color: #3b82f6; }
    .status-Loja5      { background-color: #8b5cf6; }
    .status-Finalizado { background-color: #10b981; }
    .status-Retrabalho { background-color: #ef4444; }

    /* BOTÕES */
    .card button.btn-principal {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background-color: var(--accent-green);
      color: white;
      transition: all 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .card button.btn-principal:hover {
      background-color: var(--accent-green-hover);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
    }

    .card button.btn-principal:active {
      transform: scale(0.98);
    }

    .card button.btn-salvar {
      width: 100%;
      padding: 11px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: #ffffff;
      color: #475569;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
    }

    .card button.btn-salvar:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      header { padding: 0 20px; }
      main { padding: 0 20px; margin-top: 100px; }
      .success-toast { right: 20px; left: 20px; text-align: center; }
    }
  </style>
</head>
<body>

  <div id="successMessage" class="success-toast">
    ✓ Operação realizada com sucesso!
  </div>

  <header>
    <div class="logo-area">
      <span class="icone-relogio">🕒</span>
      <span class="marca-texto">Oficina do Minuto</span>
      <span class="tag-loja5">Loja 5</span>
    </div>
    <nav>
      <a href="/admin">Dashboard</a>
      <a href="/pedidos" class="active">Pedidos</a>
      <a href="/" class="btn-sair">Sair</a>
    </nav>
  </header>

  <main>
    <section>
      <div class="section-intro">
        <h2>Pedidos Recebidos na Central</h2>
        <p>Acompanhe, faça a triagem e despache as ordens de serviço em processamento na Loja 5.</p>
      </div>

      <div id="containerPedidos" class="cards-container">
        <p class="loading">Buscando ordens de serviço ativas na central...</p>
      </div>
    </section>
  </main>

  <script type="module" src="js/loja5.js"></script>
</body>
</html>
