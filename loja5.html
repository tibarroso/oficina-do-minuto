<section>
  <h2>Criar pedido na Loja 5</h2>
  <form id="formLoja5">
    <label for="tipoServico">Tipo de serviço:</label>
    <select id="tipoServico" required>
      <option value="">Selecione</option>
      <option value="Lavanderia">Lavanderia</option>
      <option value="Sapataria">Sapataria</option>
      <option value="Costura">Costura</option>
      <option value="Bordado">Bordado</option>
    </select>

    <label for="observacaoLoja5">Observação (Loja 5):</label>
    <textarea id="observacaoLoja5" rows="3" placeholder="Observação da Loja 5"></textarea>

    <button type="submit">Criar Pedido</button>
  </form>
</section>

<section>
  <h2>Pedidos recebidos</h2>
  <div id="containerPedidos">Carregando pedidos...</div>
</section>

<script type="module" src="./js/loja5.js"></script>
