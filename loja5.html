<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loja 5 – Lavanderia & Sapataria</title>

  <!-- CSS global do sistema -->
  <link rel="stylesheet" href="./css/style.css" />

  <!-- Fonte e Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  
  <!-- Estilos específicos para a Loja 5 -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      color: #4CAF50;
    }

    h2 {
      color: #333;
      font-size: 1.5em;
      margin-top: 30px;
    }

    p {
      text-align: center;
      color: #666;
    }

    .cards-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      width: 250px;
      text-align: left;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .status-tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.9em;
      margin-top: 10px;
      color: #fff;
    }

    .status-Loja5 {
      background-color: #4CAF50;
    }

    .status-Transporte {
      background-color: #FF9800;
    }

    .status-Finalizado {
      background-color: #2196F3;
    }

    .status-Retrabalho {
      background-color: #f44336;
    }

    .status-Aguardando {
      background-color: #9E9E9E;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin: 10px 0;
      padding: 10px;
      font-size: 0.9em;
      border-radius: 5px;
      border: 1px solid #ccc;
      resize: vertical;
    }

    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px;
      font-size: 1em;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }

    button:hover {
      background-color: #45a049;
    }

    .loading {
      font-size: 1.2em;
      color: #4CAF50;
      text-align: center;
      width: 100%;
    }

    /* Estilos de erro */
    .error {
      color: red;
      text-align: center;
      width: 100%;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Loja 5 – Lavanderia & Sapataria</h1>
  <p>Acompanhe os pedidos entregues, em serviço e prontos para retorno</p>

  <!-- ========================= -->
  <!-- PEDIDOS RECEBIDOS (Entregue na Loja 5 e Em serviço) -->
  <!-- ========================= -->
  <section>
    <h2>Pedidos Recebidos</h2>
    <div id="containerPedidos" class="cards-container">
      <p class="loading">Carregando pedidos...</p>
    </div>
  </section>

  <script type="module" src="./js/loja5.js"></script>
</body>
</html>
