<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loja 5 – Lavanderia & Sapataria</title>

  <!-- Google Font: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- CSS global do sistema -->
  <link rel="stylesheet" href="./css/style.css" />

  <style>
    /* Estilos Globais */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f7fb;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: #333;
    }

    h1, h2 {
      color: #222;
      font-weight: 500;
    }

    /* Barra de navegação fixa */
    header {
      background-color: #007bff;
      color: white;
      padding: 15px 20px;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
    }

    header h1 {
      margin: 0;
    }

    header nav {
      float: right;
    }

    header nav a {
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      margin-left: 15px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    header nav a:hover {
      background-color: #0056b3;
    }

    /* Estilo para a mensagem de sucesso */
    .success-message {
      background-color: #28a745;
      color: white;
      padding: 10px 20px;
      text-align: center;
      font-size: 16px;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 5px;
      z-index: 1000;
      display: none;
      transition: opacity 0.5s ease;
    }

    /* Container de pedidos */
    section {
      padding-top: 80px; /* Para compensar o header fixo */
      padding-bottom: 50px;
      padding-left: 20px;
      padding-right: 20px;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      transition: transform 0.3s ease;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin-top: 0;
      color: #007bff;
      font-size: 18px;
    }

    .card p {
      font-size: 14px;
      color: #555;
    }

    /* Estilo para a mensagem de carregamento */
    .loading {
      font-size: 18px;
      color: #007bff;
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Loja 5</h1>
    <nav>
      <a href="#">Início</a>
      <a href="#">Pedidos</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <section>
    <h2>Pedidos Recebidos</h2>
    <p>Acompanhe os pedidos entregues.</p>

    <!-- Mensagem de sucesso (inicialmente oculta) -->
    <div id="successMessage" class="success-message">
      Pedido finalizado com sucesso!
    </div>

    <!-- Pedidos -->
    <div id="containerPedidos" class="cards-container">
      <!-- Inicialmente exibe "Carregando pedidos..." -->
      <p class="loading">Carregando pedidos...</p>
    </div>
  </section>

  <!-- Script do JavaScript -->
  <script type="module" src="./js/loja5.js"></script>
</body>
</html>
