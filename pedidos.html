<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pedidos - Oficina do Minuto</title>
<link rel="stylesheet" href="./css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Pedidos - Oficina do Minuto</h1>

<!-- Criar novo pedido -->
<section>
  <h2>Criar Pedido</h2>
  <label for="tipo">Tipo de serviço:</label>
  <select id="tipo">
    <option value="Lavanderia">Lavanderia</option>
    <option value="Sapataria">Sapataria</option>
    <option value="Costura">Costura</option>
    <option value="Bordado">Bordado</option>
  </select>
  <br><br>
  <label for="orcamento">Orçamento?</label>
  <input type="checkbox" id="orcamento">
  <br><br>
  <button id="btnCriarPedido">Criar Pedido</button>
</section>

<hr>

<!-- Lista de pedidos da loja -->
<section>
  <h2>Meus Pedidos</h2>
  <div class="filtros">
    <label>Status:</label>
    <select id="filtroStatus">
      <option value="">Todos</option>
      <option value="Aguardando coleta">Aguardando coleta</option>
      <option value="Entregue na Loja 5">Entregue na Loja 5</option>
      <option value="Finalizado">Finalizado</option>
    </select>
    <button id="btnFiltrar">Filtrar</button>
  </div>

  <div id="containerPedidos" class="cards-container"></div>
</section>

<script type="module" src="./js/pedidos_loja.js"></script>
</body>
</html>
