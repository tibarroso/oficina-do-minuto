<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos - Oficina do Minuto</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<h1>Pedidos - Oficina do Minuto</h1>

<p style="text-align:center; color:#666; margin-bottom:20px;">
  Crie, filtre e acompanhe todos os pedidos da loja
</p>

<!-- ========================= -->
<!-- CRIAR NOVO PEDIDO -->
<!-- ========================= -->
<section class="card">
  <h2>Criar Pedido</h2>

  <label for="tipo">Tipo de serviço:</label>
  <select id="tipo">
    <option value="">Selecione</option>
    <option value="Lavanderia">Lavanderia</option>
    <option value="Sapataria">Sapataria</option>
    <option value="Costura">Costura</option>
    <option value="Bordado">Bordado</option>
  </select>

  <label>
    <input type="checkbox" id="orcamento">
    Orçamento?
  </label>

  <label for="observacao">Observação (Ticket / Nº do saco):</label>
  <textarea
    id="observacao"
    rows="3"
    placeholder="Ex: Ticket 45821 - Saco nº 12"
  ></textarea>

  <button id="btnCriarPedido">Criar Pedido</button>
</section>

<!-- ========================= -->
<!-- FILTROS DE PEDIDOS -->
<!-- ========================= -->
<section class="filtros">
  <label for="filtroStatus">Filtrar por Status:</label>
  <select id="filtroStatus">
    <option value="">Todos</option>
    <option value="Aguardando coleta">Aguardando coleta</option>
    <option value="Em transporte para Loja 5">Em transporte (ida)</option>
    <option value="Entregue na Loja 5">Recebido na Loja 5</option>
    <option value="Em serviço">Em serviço</option>
    <option value="Aguardando retorno do transporte">Aguardando retorno</option>
    <option value="Em transporte para loja de origem">Em transporte (volta)</option>
    <option value="Recebido na loja de origem">Recebido na loja de origem</option>
    <option value="Finalizado">Finalizado</option>
    <option value="Retrabalho">Retrabalho</option>
  </select>
  <button id="btnFiltrar">Filtrar</button>
</section>

<!-- ========================= -->
<!-- LISTA DE PEDIDOS -->
<!-- ========================= -->
<section>
  <h2>Meus Pedidos</h2>
  <div id="containerPedidos" class="cards-container">
    <p>Carregando pedidos...</p>
  </div>
</section>

<script type="module" src="./js/pedidos_loja.js"></script>
</body>
</html>
