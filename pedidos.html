<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Criar Pedido - Oficina do Minuto</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<h1>Criar Pedido</h1>

<label for="tipo">Tipo de serviço:</label>
<select id="tipo">
  <option value="Lavanderia">Lavanderia</option>
  <option value="Sapataria">Sapataria</option>
  <option value="Costura">Costura</option>
  <option value="Bordado">Bordado</option>
</select>
<br><br>

<label>Orçamento?</label>
<input type="checkbox" id="orcamento">
<br><br>

<button onclick="criarPedido()" class="btn-primary">Criar Pedido</button>

<h2>Upload de Fotos</h2>
<label>Antes:</label>
<input type="file" id="fotoAntes" multiple>
<button onclick="uploadAntes()" class="btn-primary">Enviar Foto Antes</button>
<br><br>
<label>Depois:</label>
<input type="file" id="fotoDepois" multiple>
<button onclick="uploadDepois()" class="btn-primary">Enviar Foto Depois</button>

<script type="module" src="./js/pedidos.js"></script>
</body>
</html>
