<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte - Oficina do Minuto</title>

  <!-- Link do Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS global -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Barra de navegação fixa -->
  <header>
    <div class="container">
      <h1>Controle de Transporte</h1>
      <nav>
        <a href="index.html">Início</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="login.html">Sair</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="intro">
      <h2>Gerencie o Status dos Pedidos</h2>
      <p>Controle a coleta, entrega e retorno dos pedidos em tempo real.</p>
    </section>

    <!-- Filtro de Loja -->
    <section class="filter-section">
      <label for="filtroLoja">Filtrar por Loja:</label>
      <select id="filtroLoja">
        <option value="Todas">Todas</option>
        <option value="Oficina do Minuto I">Oficina do Minuto I</option>
        <option value="Oficina do Minuto II">Oficina do Minuto II</option>
        <option value="Oficina do Minuto III">Oficina do Minuto III</option>
        <option value="Oficina do Minuto IV">Oficina do Minuto IV</option>
        <!-- Adicione mais opções conforme necessário -->
      </select>
      <button id="btnFiltrar">Filtrar</button>
    </section>

    <!-- ========================= -->
    <!-- AGUARDANDO COLETA (IDA) -->
    <!-- ========================= -->
    <section class="section">
      <h2>Aguardando Coleta</h2>
      <div id="aguardando" class="cards-container">
        <p class="loading">Carregando pedidos...</p>
      </div>
    </section>

    <!-- ========================= -->
    <!-- EM TRANSPORTE -->
    <!-- ========================= -->
    <section class="section">
      <h2>Em Transporte</h2>
      <div id="transporte" class="cards-container">
        <p class="loading">Carregando pedidos...</p>
      </div>
    </section>

    <!-- ========================= -->
    <!-- AGUARDANDO RETORNO -->
    <!-- ========================= -->
    <section class="section">
      <h2>Aguardando Retorno do Transporte / Retrabalho</h2>
      <div id="retorno" class="cards-container">
        <p class="loading">Carregando pedidos...</p>
      </div>
    </section>
  </main>

  <!-- Script do Transporte -->
  <script type="module">
    import { supabase } from "./js/supabase.js";

    // Funções do transporte
    import { carregarPedidos } from "./js/transporte.js";

    // Função para carregar pedidos com o filtro
    document.getElementById("btnFiltrar").addEventListener("click", () => {
      const filtroLoja = document.getElementById("filtroLoja").value;
      carregarPedidos(filtroLoja); // Passando o filtro de loja para carregarPedidos
    });

    (async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert("Usuário não logado!");
        window.location.href = "login.html";
        return;
      }

      // Carrega pedidos inicialmente
      carregarPedidos("Todas");

      // Atualiza automaticamente a cada 5 segundos
      setInterval(() => carregarPedidos("Todas"), 5000);
    })();
  </script>

</body>
</html>
