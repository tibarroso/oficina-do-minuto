
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte - Oficina do Minuto</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      font-size: 11px;
    }

    body {
      background-color: #FFDE21; /* Mantém o amarelo que você pediu antes */
      margin: 10px;
      color: #333;
    }

    /* Topo / Barra de Navegação Padrão */
    header {
      background-color: #000080;
      color: #fff;
      padding: 6px 10px;
      border-radius: 3px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    header h1 {
      margin: 0;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    header nav {
      display: flex;
      gap: 12px;
    }

    header nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 2px;
      transition: background-color 0.2s;
    }

    /* AQUI: Ao passar o mouse fica preto (#000000) */
    header nav a:hover {
      background-color: #000000;
    }

    /* Introdução / Subtítulo */
    .intro {
      margin-bottom: 8px;
      font-style: italic;
      color: #333;
    }

    /* Painel de Filtro Padrão */
    .filter-section {
      background-color: #FFDE21;
      padding: 8px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      margin-bottom: 10px;
      border-radius: 3px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .filter-section label {
      font-weight: bold;
      color: #000080;
      display: block;
      margin-bottom: 3px;
    }

    .filter-container {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 3px 6px;
      border: 1px solid #7f9db9;
      background-color: #fff;
      font-weight: bold;
      color: #000080;
      border-radius: 2px;
      height: 26px;
    }

    .filter-btn {
      height: 26px;
      background: linear-gradient(to bottom, #ffffff, #dce6f1);
      border: 1px solid #7f9db9;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      color: #000080;
      padding: 0 12px;
    }

    .filter-btn:hover {
      background: #c6d9f1;
    }

    /* Sistema de Abas (Tabs) */
    .tabs-header {
      display: flex;
      gap: 4px;
      margin-bottom: 0;
      border-bottom: 1px solid #7f9db9;
    }

    .tab-btn {
      background-color: #e1ecf4;
      border: 1px solid #7f9db9;
      border-bottom: none;
      padding: 6px 12px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
    }

    .tab-btn.active {
      background-color: #fff;
      color: #000080;
      border-bottom: 1px solid #fff;
      margin-bottom: -1px;
    }

    .tab-btn:hover:not(.active) {
      background-color: #dce6f1;
    }

    /* Conteúdos das Abas */
    .tab-content {
      display: none;
      border: 1px solid #7f9db9;
      background-color: #fff;
      border-top: none;
      border-bottom-left-radius: 3px;
      border-bottom-right-radius: 3px;
      padding: 10px;
    }

    .tab-content.active {
      display: block;
    }

    /* Container de Cards / Itens */
    .cards-container {
      height: 450px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 2px;
    }

    .loading {
      color: #666;
      text-align: center;
      padding: 10px;
    }

    /* Rodapé */
    footer {
      margin-top: 15px;
      text-align: center;
      color: #333;
      border-top: 1px solid rgba(0, 0, 0, 0.15);
      padding-top: 8px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Barra de Navegação -->
  <header>
    <div class="container">
      <h1>Controle de Transporte</h1>
      <nav>
        <a href="transporte.html">Início</a>
        <a href="index.html">Sair</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="intro">
      <p>Controle a coleta, entrega e retorno dos pedidos em tempo real.</p>
    </div>

    <!-- Filtro de Loja -->
    <section class="filter-section">
      <div>
        <label for="filtroLoja">Filtrar por Loja:</label>
        <div class="filter-container">
          <select id="filtroLoja" class="filter-select">
            <option value="Todas">Todas</option>
            <option value="Oficina do Minuto I">Oficina do Minuto I</option>
            <option value="Oficina do Minuto II">Oficina do Minuto II</option>
            <option value="Oficina do Minuto III">Oficina do Minuto III</option>
            <option value="Oficina do Minuto IV">Oficina do Minuto IV</option>
          </select>
          <button id="btnFiltrar" class="filter-btn" type="button">Filtrar</button>
        </div>
      </div>
    </section>

    <!-- Cabeçalho das Abas -->
    <div class="tabs-header">
      <button class="tab-btn active" onclick="abrirAba(event, 'aba-aguardando')">Aguardando Coleta</button>
      <button class="tab-btn" onclick="abrirAba(event, 'aba-transporte')">Em Transporte</button>
      <button class="tab-btn" onclick="abrirAba(event, 'aba-retorno')">Aguardando Retorno / Retrabalho</button>
    </div>

    <!-- Conteúdo Aba 1: Aguardando Coleta -->
    <div id="aba-aguardando" class="tab-content active">
      <div id="aguardando" class="cards-container">
        <p class="loading">Carregando pedidos...</p>
      </div>
    </div>

    <!-- Conteúdo Aba 2: Em Transporte -->
    <div id="aba-transporte" class="tab-content">
      <div id="transporte" class="cards-container">
        <p class="loading">Carregando pedidos...</p>
      </div>
    </div>

    <!-- Conteúdo Aba 3: Aguardando Retorno -->
    <div id="aba-retorno" class="tab-content">
      <div id="retorno" class="cards-container">
        <p class="loading">Carregando pedidos...</p>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 Oficina do Minuto. Todos os direitos reservados.
  </footer>

  <!-- Script de Abas e Inicialização -->
  <script>
    function abrirAba(evt, idAba) {
      const contents = document.getElementsByClassName("tab-content");
      for (let i = 0; i < contents.length; i++) {
        contents[i].classList.remove("active");
      }

      const buttons = document.getElementsByClassName("tab-btn");
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
      }

      document.getElementById(idAba).classList.add("active");
      evt.currentTarget.classList.add("active");
    }
  </script>

  <!-- Script de Inicialização Único e Blindado -->
  <script type="module">
    import { supabase } from "./js/supabase.js";
    import { carregarPedidos } from "./js/transporte.js";

    const selectLoja = document.getElementById("filtroLoja");
    const btnFiltrar = document.getElementById("btnFiltrar");

    function aplicarFiltro() {
      const filtroLoja = selectLoja.value;
      carregarPedidos(filtroLoja);
    }

    if (btnFiltrar) btnFiltrar.addEventListener("click", aplicarFiltro);
    if (selectLoja) selectLoja.addEventListener("change", aplicarFiltro);

    (async () => {
      try {
        const { data: { user }, error } = await supabase.auth.getUser();

        if (error || !user) {
          alert("Sessão expirada ou usuário não conectado!");
          window.location.href = "index.html"; 
          return;
        }

        aplicarFiltro();

        setInterval(() => {
          aplicarFiltro();
        }, 300000);
      } catch (err) {
        console.error("Erro na verificação de autenticação:", err);
      }
    })();
  </script>

</body>
</html>
