<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte - Oficina do Minuto</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- Barra de navegação fixa -->
<header>
  <div class="container">
    <h1>Transporte</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="pedidos.html">Pedidos</a>
      <a href="login.html">Sair</a>
    </nav>
  </div>
</header>

<main>
  <section class="intro">
    <h2>Controle de Coleta, Entrega e Retorno</h2>
    <p>Gerencie o status de cada pedido durante o transporte.</p>
  </section>

  <!-- ========================= -->
  <!-- AGUARDANDO COLETA (IDA) -->
  <!-- ========================= -->
  <section>
    <h2>Aguardando Coleta</h2>
    <div id="aguardando" class="cards-container">
      <p class="loading">Carregando pedidos...</p>
    </div>
  </section>

  <!-- ========================= -->
  <!-- EM TRANSPORTE -->
  <!-- ========================= -->
  <section>
    <h2>Em Transporte</h2>
    <div id="transporte" class="cards-container">
      <p class="loading">Carregando pedidos...</p>
    </div>
  </section>

  <!-- ========================= -->
  <!-- AGUARDANDO RETORNO -->
  <!-- ========================= -->
  <section>
    <h2>Aguardando Retorno do Transporte / Retrabalho</h2>
    <div id="retorno" class="cards-container">
      <p class="loading">Carregando pedidos...</p>
    </div>
  </section>
</main>

<!-- Script do Transporte -->
<script type="module">
  import { supabase } from "./js/supabase.js";

  // Funções do transporte
  import { carregarPedidos } from "./js/transporte.js";

  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
      alert("Usuário não logado!");
      window.location.href = "login.html";
      return;
    }

    // Carrega pedidos inicialmente
    carregarPedidos();

    // Atualiza automaticamente a cada 5 segundos
    setInterval(carregarPedidos, 5000);
  })();
</script>

</body>
</html>
