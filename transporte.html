<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte - Oficina do Minuto</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<h1>Transporte</h1>

<p style="text-align:center; color:#666; margin-bottom:20px;">
  Controle de coleta, entrega e retorno dos pedidos
</p>

<!-- ========================= -->
<!-- AGUARDANDO COLETA (IDA) -->
<!-- ========================= -->
<section>
  <h2>Aguardando Coleta</h2>
  <div id="aguardando" class="cards-container">
    <p>Carregando pedidos...</p>
  </div>
</section>

<!-- ========================= -->
<!-- EM TRANSPORTE -->
<!-- ========================= -->
<section>
  <h2>Em Transporte</h2>
  <div id="transporte" class="cards-container">
    <p>Carregando pedidos...</p>
  </div>
</section>

<!-- ========================= -->
<!-- AGUARDANDO RETORNO -->
<!-- ========================= -->
<section>
  <h2>Aguardando Retorno do Transporte</h2>
  <div id="retorno" class="cards-container">
    <p>Carregando pedidos...</p>
  </div>
</section>

<!-- JS do transporte -->
<script type="module" src="./js/transporte.js"></script>

</body>
</html>
